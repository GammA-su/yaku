  mode: v1-overlay
  target_lang: en
  tick_ms: 300
audio:
  auto_install_prompt: true
  backend: kotoba_whisper
  chunk_seconds: 7.0
  vad_threshold: 0.3
  min_speech_ms: 350
  min_silence_ms: 450
  merge_speech_gap_ms: 900
  vad_tail_ms: 350
  compute_type: auto
  dedupe_window: 5
  device: auto
  device_id: 0
  device_name: Default Device
  download_models: true
  enabled: true
  install_state: auto
  language: ja
  local_model_path: null
  min_transcript_chars: 2
  model: kotoba-tech/kotoba-whisper-v2.0-faster
  model_cache_dir: models/asr
  optional_dependencies_group: audio
  sample_rate: 16000
  source: auto
  vad_enabled: true
cache:
  cache_edited_frames: true
  cache_translations: true
  sqlite_path: out/yaku_cache.sqlite3
glossary:
  enabled: true
  entries:
  - note: Keep as honorific unless unnatural.
    source: 先輩
    target: senpai
  - note: Use affectionate tone.
    source: お兄ちゃん
    target: big brother
metrics:
  enabled: true
  include_text_preview: true
  log_jsonl: true
  log_path: out/metrics/yaku_latency.jsonl
  preview_chars: 80
  slow_event_ms: 1500
ocr:
  backend: paddleocr
  hash_threshold: 0
  min_chars: 1
  region:
    h: 267
    w: 723
    x: 290
    y: 638
translator:
  backend: llama_cpp
  context_lines: 3
  deepl:
    api_key: null
    api_key_env: DEEPL_API_KEY
    formality: default
    target_lang: EN-US
    use_context: true
  llama_cpp:
    api_key_env: longapikey
    base_url: http://127.0.0.1:8080/v1
    disable_reasoning: true
    max_tokens: 256
    model: qwen-local
    port: 8080
    temperature: 0.2
    use_hosted: true
v1_overlay:
  background_opacity: 0.55
  click_through: true
  duplicate_suppression_window: 3
  font_family: Arial
  font_size: 28
  h: 120
  locked: false
  opacity: 0.85
  pending_behavior: keep_previous
  save_geometry_on_exit: true
  show_source_in_debug: true
  show_status_badge: true
  text_outline: true
  w: 900
  x: 100
  y: 700
v1_overlay_max:
  enabled: true
  scan_scope: window
  scan_interval_ms: 1500
  hash_threshold: 6
  max_regions: 30
  min_text_chars: 1
  japanese_only: true
  translate_individual_regions: true
  merge_nearby_boxes: true
  merge_distance_px: 16
  require_ocr_boxes: true
  force_paddleocr_warning: true
  overlay:
    font_family: Arial
    font_size: 13
    max_width: 260
    padding: 6
    opacity: 0.82
    background: [0, 0, 0]
    foreground: [255, 255, 255]
    anchor: right
    avoid_offscreen: true
    show_source_in_debug: true
  cache:
    enabled: true
v4_yomitan:
  enabled: true
  region:
    x: 0
    y: 0
    w: 800
    h: 300
    is_set: false
  scan_scope: region
  scan_interval_ms: 1000
  hash_threshold: 6
