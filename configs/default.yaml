  japanese_only: true
  tokenizer: simple
  hover_trigger: none
  lookup_on_hover: true
  lookup_on_click: true
  max_hover_results: 8
  dictionaries:
    enabled: true
    dictionary_dir: dictionaries
    index_path: out/yomitan_index.sqlite3
    auto_import_on_start: true
    imported_manifest_path: out/yomitan_imported.json
