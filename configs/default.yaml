  popup:
    font_family: Arial
    font_size: 14
    max_width: 520
    max_height: 420
    opacity: 0.95
    show_reading: true
    show_frequency: true
    show_pitch: true
    show_tags: true
    show_source_sentence: true
    show_dictionary_name: true
  debug:
    save_ocr_region: false
    debug_dir: out/debug/v4_yomitan
v2_mirror:
