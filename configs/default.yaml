app:
  debug: true
  mode: v1-overlay
  target_lang: en
  tick_ms: 300
cache:
  cache_edited_frames: true
  cache_translations: true
  sqlite_path: out/yaku_cache.sqlite3
glossary:
  enabled: true
  entries:
  - note: Keep as honorific unless unnatural.
    source: 先輩
    target: senpai
  - note: Use affectionate tone.
    source: お兄ちゃん
    target: big brother
metrics:
  enabled: true
  include_text_preview: true
  log_jsonl: true
  log_path: out/metrics/yaku_latency.jsonl
  preview_chars: 80
  slow_event_ms: 1500
ocr:
  backend: paddleocr
  hash_threshold: 0
  min_chars: 1
  region:
    h: 267
    w: 723
    x: 290
    y: 638
translator:
  backend: llama_cpp
  context_lines: 3
  deepl:
    api_key: null
    api_key_env: DEEPL_API_KEY
    formality: default
    target_lang: EN-US
    use_context: true
  llama_cpp:
    api_key_env: longapikey
    base_url: http://127.0.0.1:8080/v1
    disable_reasoning: true
    max_tokens: 256
    model: qwen-local
    port: 8080
    temperature: 0.2
    use_hosted: true
v1_overlay:
  background_opacity: 0.55
  click_through: true
  duplicate_suppression_window: 3
  font_family: Arial
  font_size: 28
  h: 120
  locked: false
  opacity: 0.85
  pending_behavior: keep_previous
  save_geometry_on_exit: true
  show_source_in_debug: true
  show_status_badge: true
  text_outline: true
  w: 900
  x: 100
  y: 700
v2_mirror:
  ai_text_edit:
    backend: external_http
    deterministic_text_after_ai: true
    enabled: false
    endpoint: http://127.0.0.1:7860
    fallback: inpaint-text
    timeout_sec: 30
  forward_input: true
  fullscreen: false
  inpaint:
    backend: opencv
    debug_draw_mask: false
    fallback_to_mask_text: true
    mask_padding: 4
    method: telea
    radius: 3
  input_focus_mode: send_input_only
  preserve_aspect_ratio: true
  render_mode: inpaint-text
  render_text:
    auto_fit: true
    fallback_fill:
    - 255
    - 255
    - 255
    fallback_stroke:
    - 0
    - 0
    - 0
    font_family: Noto Sans
    font_path: null
    font_size: null
    line_spacing: 1.15
    max_font_size: 42
    min_font_size: 14
    sample_style_from_source: true
    stroke_width: 2
  replacement_region:
    h_ratio: 0.2
    w_ratio: 0.84
    x_ratio: 0.08
    y_ratio: 0.72
  text_region:
    h_ratio: 0.14
    w_ratio: 0.76
    x_ratio: 0.12
    y_ratio: 0.76
window:
  capture_backend: mss
  hwnd: 1772238
  title_contains: IsekaiBrideHunting
