    x_ratio: 0.08
    y_ratio: 0.72
  text_region:
    h_ratio: 0.14
    w_ratio: 0.76
    x_ratio: 0.12
    y_ratio: 0.76
window:
  capture_backend: mss
  hwnd: 1772238
  title_contains: IsekaiBrideHunting
